name: Build and Release Android

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Configure Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ ERROR: ANDROID_KEYSTORE_BASE64 secret is not configured! Release builds must be consistently signed."
            exit 1
          fi
          echo "🔐 Decoding release keystore from secrets..."
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          echo "✅ Release signing configured via key.properties"

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Build App Bundle (Release)
        run: flutter build appbundle --release

      - name: Verify APK Signature
        run: |
          echo "🔍 Verifying APK signing certificate..."
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: wavepass-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Release AppBundle
        uses: actions/upload-artifact@v4
        with:
          name: wavepass-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create or Update GitHub Release (Source Repo)
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.get_version.outputs.version }}
          name: WavePass ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.get_version.outputs.version }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true

      - name: Deploy Release to Public Distribution Repo (WavePass-App)
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.get_version.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "⚠️ GH_RELEASE_TOKEN secret not set, skipping public repo release"
            exit 0
          fi
          echo "🚀 Deploying release to public distribution repo Icedmist/WavePass-App..."
          gh release create "$TAG_NAME" \
            --repo Icedmist/WavePass-App \
            --title "WavePass $TAG_NAME" \
            --notes "Official public release for WavePass Mobile Application ($TAG_NAME)." \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/bundle/release/app-release.aab || \
          gh release upload "$TAG_NAME" \
            --repo Icedmist/WavePass-App \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/bundle/release/app-release.aab \
            --clobber
          echo "✅ Release successfully deployed to Icedmist/WavePass-App"
